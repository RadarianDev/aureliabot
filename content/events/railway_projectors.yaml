id: railway_projectors
title: The Railway Projectors
text: >-
  Railway promoters crowd the lobbies of the new Assembly with maps and prospectuses. Some want the Crown
  to lay a trunk line from the capital to the eastern coast. The rest want only the right to build their
  own lines, and to be left alone.
effects:
  - if: "not issue.public_works.open"
    then: { open.public_works: true }
  - { bill.railway_charter: true, bill.private_railways_act: true }
