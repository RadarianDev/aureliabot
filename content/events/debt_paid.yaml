id: debt_paid
title: The Grateful Neighbour
text: >-
  The Aurelian guarantee reaches the Arrosian exchange before the regiments reach the Garaztian ports.
  The merchant houses take their interest, grumbling, and the ultimatum is quietly withdrawn. King Fernao
  sends the Assembly a letter of thanks, a crate of red wine and the promise that Garaztia does not forget
  its friends.
effects:
  - { cancel.arrosian_ultimatum: true, cancel.the_collection: true, cancel.refugees_in_gares: true,
      cancel.gares_border_lords: true, cancel.bon_princes_nervous: true, cancel.valleys_choose: true,
      cancel.valleys_rally: true, cancel.valleys_welcome: true, cancel.charters_echo: true,
      cancel.garaztian_war_ends: true }
  - { var.garaztia_ending: "=1", var.garaztia_war: "=0", var.garaztia_goodwill: 1,
      threat: -5, economy: 10, discontent.provencie_gares: -1 }
  - if: "issue.garaztian_question.open"
    then: { close.garaztian_question: true }
  - if: "condition.provencie_gares.refugees"
    then: { event.gares_camps_close: 2 }
