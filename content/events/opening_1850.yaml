id: opening_1850
title: The King Summons the Assembly
text: >-
  By His Majesty's command, the first Aurelian Assembly is to be elected before the summer. Across the
  ten provinces candidates take to the hustings, and every party must tell the nation where it stands on
  the questions of the age.
