id: garaztian_king_visit
title: The King of Garaztia in Aurelle
text: >-
  King Fernao III of Garaztia drives through Aurelle in an open carriage, waving his hat to the crowds and
  kissing the hands of fishwives. He dances at the Admiralty, praises the railway and is cheered at the
  opera. In private, between the fish and the ices, he asks the Treasury for a loan.
schedule: { season: Summer, year: 1857 }
