id: lanten_strike
title: Strike at the Lanten Docks
text: >-
  The Lanten dockers walk out over wages, and the harbour falls silent. The owners say the men are well
  paid; the men say otherwise. Ships lie three deep in the roads.
effects: { discontent.ocidanten: 1, salience.social_reform: 1,
           condition.ocidanten.striking: 1, crisis.lanten_dock_strike: true }
