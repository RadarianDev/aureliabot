id: peace_defeat
title: The Peace of Defeat
text: >-
  The passes are lost, and Mugi dictates the peace at Bon. Aurelia pays an indemnity, renounces South
  Arpal for good, and Mugian soldiers stay in the North Arpal valleys until the last instalment is paid.
  In the Assembly, members are counting heads.
