id: colonies
title: The Southern Trade
summary: "Whether Aurelia-Anzaria plants its own trading posts and flag beyond the seas, in Meridia, the one continent no power has claimed."
for: Aurelia-Anzaria must have its own cotton, its own coaling ports and its own flag beyond the seas.
against: Colonies are a rich man's adventure, paid for with the poor man's taxes and the sailor's life.
opinion: -0.1
salience: 1
