id: electoral_reform
title: Electoral Reform
summary: "Who may vote, how they vote, and what Parliament should look like. Every man has the vote, and since the last reform so do women of property, but all of them still vote aloud at the hustings."
for: Let the whole nation choose its Assembly, freely and in secret.
against: The franchise is wide enough already; keep the hustings as they are.
opinion: 0.2
salience: 3
