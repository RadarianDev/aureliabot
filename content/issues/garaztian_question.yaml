id: garaztian_question
title: The Garaztian Debt
summary: "Whether Aurelia stands by Garaztia against the Arrosian merchant houses, who mean to collect its debts at the border."
for: Garaztia is our neighbour, and a creditors' army on the Gares border is Aurelia's business.
against: Garaztia borrowed and Garaztia must pay; Aurelia has no place in another king's ledger.
opinion: 0.0
salience: 1
