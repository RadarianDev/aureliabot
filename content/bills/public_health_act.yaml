id: public_health_act
title: The Public Health Act
summary: "Creates boards of health with the power to lay sewers and quarantine the sick, and begins draining the Tovrerie fens at the Crown's expense."
issue: public_works
lean: For
motion: Create boards of health with the power to lay sewers and quarantine the sick, and drain the fens of Tovrerie at the Crown's expense.
pass:
  text: >-
    Boards of health take up their posts in every town, and the first navvies march south to the fens.
    Dr Septimus Quarles, who has argued for this for twenty years, is named to the first board.
  effects: { discontent.aurenten: -1, discontent.iracterie: -1, project.fen_drainage: true }
