id: new_poor_law
title: The New Poor Law
summary: "Replaces parish relief with national workhouses. It saves money and helps the economy, at a heavy cost in the poorer provinces, and Aurenten turns lawless."
issue: social_reform
lean: Against
motion: Abolish parish relief, and send the able-bodied poor to national workhouses.
pass:
  text: >-
    The workhouse gates open and families are parted at the door. The Boards of Guardians report the cost
    of relief halved. The gangs recruit from those who would not go in.
  effects: { economy: 30, purse.Interior: 40, condition.aurenten.lawless: 1,
             discontent.aurenten: 2, discontent.iracterie: 2, discontent.provencie_sacs: 1,
             event.sacsmoor_workhouse: 3 }
