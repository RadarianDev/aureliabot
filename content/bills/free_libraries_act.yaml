id: free_libraries_act
title: The Free Libraries Act
summary: "Lets any town levy a halfpenny rate for a free public library, and opens the first wherever the Interior chooses. Cheap, popular with the working towns, and a little dull for everyone else."
issue: public_works
lean: For
motion: Allow any town council to levy a rate of a halfpenny in the crown for a free public library and reading room.
pass:
  text: >-
    The Interior goes looking for a town to take the first free library: four thousand books and a notice
    forbidding conversation. The colliers are already asking where.
  effects: { purse.Interior: -5, discontent.iracterie: -1, project.free_library: true }
