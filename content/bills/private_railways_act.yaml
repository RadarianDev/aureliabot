id: private_railways_act
title: The Private Railways Act
summary: "Lets private companies buy land for their railways by compulsory purchase, at no cost to the Crown. The economy and Iracterie boom, and the farming provinces resent it."
issue: public_works
lean: Against
motion: Let any railway company with a hundred subscribers buy land along its line by compulsory purchase, without a penny from the Crown.
pass:
  text: >-
    Railway companies are floated by the dozen, and their surveyors walk through orchards and churchyards
    with the law in their pockets. The squires of the western shires take them to court, and lose.
  effects: { economy: 40, condition.iracterie.booming: 1,
             discontent.agrinenten: 1, discontent.provencie_sacs: 1, event.railway_mania: 3 }
