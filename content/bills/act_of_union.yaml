id: act_of_union
title: The Act of Union
summary: "Ends the Anzarian nobles' privileges and settles the question of integration for good. The Treasury gains and the capital cheers, but the nobles will be furious and the frontier grows more dangerous."
issue: integration
lean: For
motion: Abolish the ancient privileges of the Anzarian nobility, and bring Anzaria under the laws and taxes of the Assembly.
pass:
  text: >-
    The Anzarian charters are struck from the statute book. The lords leave the capital without a word,
    and their retainers are seen drilling in the manor yards. The Duke of Corvasse says only that
    Anzaria will remember.
  effects: { favour: -25, favourBaseline: -20, threat: 10, purse.Treasury: 50,
             discontent.agrinenten: 2, discontent.soralenten: 2, discontent.aurenten: -1,
             close.integration: true, event.manor_yards: 2 }
