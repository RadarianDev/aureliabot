id: free_ports_act
title: The Free Ports Act
summary: "Makes Saltmouth and Lanten duty-free. Good for trade and for Ocidanten, paid for from the reserve, and it may break the smugglers' hold on the coast."
issue: free_trade
lean: For
motion: Make Saltmouth and Lanten free ports, where foreign goods land without duty.
pass:
  text: >-
    The customs houses at Saltmouth and Lanten close their ledgers. The smugglers find honest work on the
    quays, and the farmers inland complain that foreign butter is now cheaper than their own.
  effects:
    - { economy: 30, reserve: -20, discontent.ocidanten: -2,
        discontent.provencie_sacs: 1 }
    - if: "condition.ocidanten.lawless"
      then: { condition.ocidanten.lawless: -1 }
