id: army_bill
title: The Army Bill
summary: "Conscripts every able man of twenty for three years. A far stronger defence, paid for by the War purse, the economy and anger in the farming provinces."
issue: rearmament
lean: For
motion: Introduce three years' general conscription for every able man of twenty.
