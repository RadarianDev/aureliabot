id: arpal_question
title: The Arpal Question
summary: "Whether the Crown stands by the Aurelian villages of South Arpal, Mugian land below the passes since Mugi left the Empire."
for: South Arpal is Aurelian land and Aurelian people, and the Crown must stand by them.
against: South Arpal is Mugi's by treaty, and Aurelia's quarrels are at home.
opinion: 0.2
salience: 1
