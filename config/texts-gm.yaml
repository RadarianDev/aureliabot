      Let every party declare where it stands.
    started: "The game has started: {label}, the founding pre-election. {events} event(s) fired. The election runs at {when}, after {days} campaign day(s)."
    button: "Start the game"
    confirm: "Start the game in {season}? This loads the provinces, sets every starting value from `constants.yaml`, funds the purses, raises the starting forces and opens the founding pre-election ({days} days). It can only be done once."
