# Every text the bot sends, grouped by area. Edit the wording freely: the bot reloads this file a
# moment after it is saved. Keep the {placeholders}: the bot fills them in (a name, a number, a date).
# Keep the keys (the names before the colons) as they are: the code looks texts up by key.
# Markdown works: **bold**, *italics*, ## headings, > quotes. A text spanning several lines uses |-.

