help:
  basics: |-
    ## How Aurelia works
    Each turn is one season and lasts one real day; it ends at the daily resolution. The pre-election turn lasts {preElectionDays} days and ends in an election.
    Money, popularity, seats and forces are public numbers. The people's mood is told in words.
    `/me` shows what is waiting on you, `/info` shows anything in the game.
  parties: |-
    ## Parties
    The GM founds parties at the request of two or more factions. Only parties stand in elections.
    - `/party apply` joins a party, only during the pre-election, with the agreement of a majority of its members.
    - `/party leave` makes you independent; you keep your seats. A party left with one faction dissolves.
    - Each party has a chat and a foreign affairs channel. Any member can let outsiders into the foreign affairs channel with `/party foreign add`, take them out with `/party foreign remove`, and see who is in with `/party foreign list`.
    - A party writes its programme as a message and sends the GM its link. Outside the pre-election, flipping a stance between For and Against costs every member {flipPenalty} popularity.
  campaigning: |-
    ## Campaigning
    Each turn you take up to {actionsPerTurn} actions, and {actionsPerDay} a day in the pre-election. Campaigns and attacks happen in one province, your home province unless you name another:
    - **Campaign** on an issue: talking about an issue people care about always wins you some popularity there, and more if the province agrees with you.
    - **Attack** a rival's stance: they lose popularity there if the province disagrees with them; otherwise it backfires on you.
    - **Poll** an issue, for the kingdom and every province.
    You can run one campaign and one attack per province each turn; in the pre-election, campaigns are unlimited. Popularity is kept per province, and what you win in one province spreads to the rest of the kingdom over the following seasons.
    All actions are revealed together when the turn ends.
  opposition: |-
    ## Opposition
    A faction in a party with no cabinet seat is in opposition, and has one opposition action a season: `/opposition question` to question a minister, or `/bill propose` to put a private bill to the Assembly (one a year). `/opposition condemn` backs *For* or *Against* on a live crisis before the minister answers: being right where the minister was wrong earns popularity, being wrong where the minister was right costs it.
  voting: |-
    ## Voting
    Each faction votes all its seats one way, with the buttons on the post in #assembly, `/vote`, or from `/me`. A bill passes when more seats vote for it than against; a tie fails. Votes are secret until the count: only then are the totals and each faction's vote published. Voting Yes on a bill takes its side of the issue as your stance once the vote is counted, No the other side. Cabinet and no-confidence votes stay open until the end of the next turn. Any faction outside the cabinet can table a motion of no confidence with `/noconfidence`; it goes to a vote once its backers hold a sixth of the seats.
  ministries: |-
    ## Ministries
    The King appoints a Chancellor, who names four ministers with `/chancellor nominate`: Treasury, War, Interior, and Commerce and Labor. The Assembly then approves the cabinet. The Chancellor alone puts government bills before the Assembly, one a turn, with `/bill propose`. A crisis goes to the minister of its ministry (the Chancellor if the ministry is empty), who picks an answer with `/crisis respond` before the next resolution: leaning with the people of its province gains popularity, against them costs it, and an answer the purse cannot pay goes wrong. The Treasury divides the yearly budget each Winter with `/treasury allocate` and grants from the reserve with `/treasury grant`; War and Interior raise, train and station their units with `/war` and `/interior`, and Interior can order a crackdown; a project's minister starts ministerial projects with `/ministry project` and sets their spending with `/ministry fund`. Ministers also answer questions; `/ministry status` shows a ministry's purse and business, and `/ministry resign` steps down.
  elections: |-
    ## Elections
    Seats are counted province by province, by population. A party's strength is its factions' combined popularity, weighed by how well its programme fits the local mood. Every faction in a standing party also wins a safe borough seat in its home province.
  unknown: "Unknown topic."

