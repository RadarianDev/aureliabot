help:
  basics: |-
    ## How Aurelia works
    Each turn is one season and lasts one real day; it ends at the daily resolution. The pre-election turn lasts {preElectionDays} days and ends in an election.
    Money, popularity, seats and forces are public numbers. The people's mood is told in words.
    `/me` shows what is waiting on you, `/info` shows anything in the game.
  parties: |-
    ## Parties
    The GM founds parties at the request of two or more factions. Only parties stand in elections.
    - `/party apply` joins a party, only during the pre-election, with the agreement of a majority of its members.
    - `/party leave` makes you independent; you keep your seats. A party left with one faction dissolves.
    - A party writes its programme as a message and sends the GM its link. Outside the pre-election, flipping a stance between For and Against costs every member {flipPenalty} popularity.
  campaigning: |-
    ## Campaigning
    Each turn you take up to {actionsPerTurn} actions of different kinds (per day in the pre-election):
    - **Campaign** on an issue: gain popularity if the nation agrees with you.
    - **Attack** a rival's stance: they lose popularity if the nation disagrees with them; otherwise it backfires.
    - **Poll** an issue, nationally or in one province.
    All actions are revealed together when the turn ends. *(Coming in a later update.)*
  opposition: |-
    ## Opposition
    A faction in a party with no cabinet seat is in opposition, and has one opposition action a season: question a minister, condemn a crisis, or propose a bill (once a year). *(Coming in a later update.)*
  voting: |-
    ## Voting
    Each faction votes all its seats one way. A bill passes when more seats vote for it than against. Cabinet and no-confidence votes stay open until the end of the next turn. *(Coming in a later update.)*
  ministries: |-
    ## Ministries
    The Chancellor names four ministers: Treasury, War, Interior, and Commerce and Labor. Ministers answer crises, manage forces and run projects. *(Coming in a later update.)*
  elections: |-
    ## Elections
    Seats are counted province by province, by population. A party's strength is its factions' combined popularity, weighed by how well its programme fits the local mood. Every faction in a standing party also wins a safe borough seat in its home province. *(Coming in a later update.)*
  unknown: "Unknown topic."

