programme:
  noColon: "no colon; write it as `Issue: Opinion`"
  closed: "{issue} is closed"
  unknownIssue: "unknown issue \"{issue}\""
  duplicate: "{issue} is already given on line {line}"
  silent: Silent is not an opinion; leave the issue out for no stance
  unknownOpinion: "unrecognised opinion \"{opinion}\"; use Strongly For, For, Against or Strongly Against"

names:
  stance:
    stronglyFor: Strongly For
    for: For
    silent: no stance
    against: Against
    stronglyAgainst: Strongly Against
  ministry:
    war: War
    interior: Interior
    commerceLabor: Commerce and Labor
    treasury: Treasury
    navy: Navy
  templateKind:
    issue: issue
    bill: bill
    project: project
    event: event
    crisis: crisis
