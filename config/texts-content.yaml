  favour:
    content: content
    calm: calm
    restless: restless
    resentful: resentful
    defiant: defiant
  discontent:
    quiet: quiet
    grumbling: grumbling
    restless: restless
    unruly: unruly
    rioting: rioting
  poll:
    kingdom: Across the kingdom
    province: In {province}
    divided: the people are *divided* on it
    mood: the people are *{mood}* it
