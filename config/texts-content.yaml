templates:
  yamlSyntax: "YAML syntax: {message}"
  emptyFile: The file is empty.
  onePerFile: Write one template per file.
  notAMap: "The file must be a map of fields, such as `id: labour`."
  unknownKind: "Can't tell what kind of template this is: a crisis has `answers`, a bill `lean`, a project `price`, an event `text` and an issue `for`."
  noIssueTemplate: "`issue`: no issue template `{issue}`."
  unknownCondition: "`requires`: unknown condition `{condition}`."
  hereNeedsProvince: "`here` needs a `province`, or `ministerial: true` so the minister chooses one."
  bonusDeadline: "`bonus` needs exactly one deadline: `by: { season, year }` or `within: <seasons>`."
  scheduleShape: "`schedule` takes either `{ season, year }` or `{ delay }`."
  answerNotMap: answer {number} must be a map with `lean`, `label`, `text` and optionally `price` and `effects`.
  answerPath: "answer {number}: "
  twoAnswers: A crisis needs at least two answers.
  answersList: "`answers` must be a list, each item starting with `- lean:`."
  fieldName: "{path}`{field}`"
  quotedField: "`{field}`"
  plainFieldNames: "{path}field names must be plain words."
  unknownField: "{path}unknown field `{field}`. Allowed here: {allowed}."
  required: "{field} is required."
  singleValue: "{field} must be a single value."
  emptyField: "{field} is empty."
  slug: "{field} must be a slug of lowercase letters, digits and underscores, not `{value}`."
  unknownProvince: "{field}: unknown province `{value}`."
  number: "{field} must be a number, not `{value}`."
  range: "{field} must be from {min} to {max}, not {value}."
  money: "{field} must be a number of crowns, not `{value}`."
  negative: "{field} can't be negative."
  wholeNumber: "{field} must be a whole number, not `{value}`."
  atLeast: "{field} must be at least {min}."
  boolean: "{field} must be `true` or `false`."
  leanWithNeutral: "{field} must be `For`, `Against` or `Neutral`, not `{value}`."
  lean: "{field} must be `For` or `Against`, not `{value}`."
  navyMinistry: "{field}: the Navy has no minister; use `War`, `Interior`, `CommerceLabor` or `Treasury`."
  ministry: "{field} must be `War`, `Interior`, `CommerceLabor` or `Treasury`, not `{value}`."
  season: "{field} must be `Spring`, `Summer`, `Autumn` or `Winter`, not `{value}`."
  childMap: "{field} must be a map with {allowed}."
  effectsMap: "{field} must be a map such as `{ economy: -2, open.labour: true }`."
  effectKeyPlain: "{field}: each effect key must be a plain word, such as `economy`."
  effectSingleValue: "{field}: `{key}` takes a single value."
  effectError: "{field}: {error}"

effects:
  errors:
    tooManyTokens: "`{raw}`: write one key and at most one value, such as `economy -2`."
    forKey: "`{key}`: {error}"
    invalidKey: is not a valid effect key.
    actionShape: write it as `{prefix}.<id>`.
    actionValue: an action takes no value (or `true` in YAML).
    crisisOnlyEvents: only events can post a crisis.
    needsNumber: needs a number.
    notANumber: "`{value}` is not a number."
    scalarNoId: "`{prefix}` takes no id."
    purseShape: write it as `purse.<ministry>`.
    navyPurse: the Navy purse is a contribution and cannot be changed by effects.
    purseMinistry: the ministry must be War, Interior, CommerceLabor or Treasury.
    discontentShape: write it as `discontent.<province>`.
    conditionShape: write it as `condition.<province>.<condition>`.
    conditionValue: a condition takes 1 (gives it) or -1 (removes it).
    issueShape: write it as `{prefix}.<issue>`.
    popularityShape: write it as `popularity.<faction user id>`.
    noBaseline: issue opinion has no baseline; use `opinion.<issue>`, which lasts.
    unknownKey: is not an effect key.
    hereOnlyInProjects: "`here` only works in a project's effects."
    unknownProvince: unknown province `{id}`.
    unknownCondition: unknown condition `{id}`.
    unknownIssue: unknown issue `{id}`.
    noIssueTemplate: no issue template `{id}`.
    noBillTemplate: no bill template `{id}`.
    noProjectTemplate: no project template `{id}`.
    noCrisisTemplate: no crisis template `{id}`.
    noFaction: no faction for user `{id}`.
  summary:
    open: "New issue: {issue}"
    close: "Issue closed: {issue}"
    bill: "New bill: {bill}"
    project: "Project begun: {project}"
    crisis: "Crisis: {crisis}"
    conditionGained: "{province} is now *{condition}*"
    conditionLost: "{province} is no longer *{condition}*"
    economy: Economy
    reserve: Reserve
    seats: Assembly seats
    taxRate: Tax rate
    percent: "{amount}%"
    purse: "{ministry} purse"
    popularity: "{faction} popularity"
    discontent: Discontent in {province}
    opinion: Opinion on {issue}
    salience: "Salience: {issue}"
    favour: Anzarian Favour
    threat: Foreign Threat
    line: "{arrow} {name}"
    lineWithAmount: "{arrow} {name} {amount}"

