# Secret agendas: one is dealt to every faction at the start of each term, never the same one twice in a row.
# Each id (magnate, general, ...) is stored with every hand dealt: once agendas are dealt, change names,
# descriptions and wishes freely, but never rename an id, or the hands holding it are lost.
# They are revealed and scored on election night: a wish is met when its track moved the wanted way by more
# than its margin, between the turn the agenda was dealt and the election.
# Tracks: economy, reserve, army (total sides of every division), discontent (provinces' average, by
# population), favour (Anzarian Favour), threat (Foreign Threat).

# Rewards are prestige: it never fades and ranks the leaderboard (/info prestige).
reward: { perWish: 4, allBonus: 2 }

margins: { economy: 5, reserve: 10, army: 1, discontent: 0.25, favour: 2, threat: 2 }

agendas:
  magnate:
    name: The Magnate
    description: Prosperity is the surest defence a nation has. Every crown kept out of the barracks can build a mill, a railway or a school, and a working, well-fed Aurelia will outlast any army.
    wants: { economy: up, army: down }
  general:
    name: The General
    description: Peace is kept by those ready to defend it. The world beyond the borders grows more dangerous, and the sooner Aurelia admits it, the sooner it will give its army the strength it needs.
    wants: { army: up, threat: up }
  diplomat:
    name: The Diplomat
    description: The union with Anzaria has kept Aurelia safe for generations. Patient goodwill with our partners and quiet borders serve the kingdom better than any show of strength.
    wants: { favour: up, threat: down }
  patriot:
    name: The Patriot
    description: A kingdom should answer for its own safety. Aurelia has leaned on Anzaria long enough; it is time it stood on its own feet, with an army of its own to stand behind it.
    wants: { favour: down, army: up }
  agitator:
    name: The Radical
    description: A peace bought with hunger wages is no peace at all. Until the people feel their grievances and the great fortunes stop growing at their expense, nothing will truly change.
    wants: { discontent: up, economy: down }
  treasurer:
    name: The Treasurer
    description: Sound money and a settled country. A kingdom that saves in good years and keeps its people content needs no grand schemes to weather the bad ones.
    wants: { reserve: up, discontent: down }
