news:
  dispatches:
    header: |-
      ## Dispatches from the hustings
      {season}
    quiet: A quiet day on the hustings.
  season:
    header: "## {season}"
    hustingsOpen: "The hustings open: this season ends in an election."
    closes: The season closes {when}.
  campaignLog:
    header: "## The campaign, {season}"
  event:
    post: |-
      ## {title}
      {when}
      {text}
  action:
    noStance: no stance
    offProgramme: " (off-programme)"
    campaign: "{actor} campaigns *{stance}* on {issue}{offProgramme}: popularity {change}."
    attackLanded: "{actor} attacks {target} on {issue}, and lands the blow: {target} popularity {change}."
    attackBackfired: "{actor} attacks {target} on {issue}, but the nation sides with {target}: {actor} popularity {change}."
  party:
    dissolvedEmpty: "**The {party} dissolves.** Its benches have emptied, and what remains of it sits on as independent."
    dissolvedLast: "**The {party} dissolves.** With its ranks dwindled to {faction} alone, the party is no more. {faction} sits on as an independent and keeps {seats}."
    oneSeat: its one seat
    seats: its {seats} seats
  turnTracker:
    preElection: "{name} · Pre-election"
    paused: "{name} · Paused"

dashboard:
  title: The Kingdom of Aurelia · {label}
  calendarField: Calendar
  calendar: |-
    {label}{preElection}{paused}
    Next resolution: {nextResolution}
    Next election: end of {nextElection}
  preElectionTag: " · **Pre-election**"
  pausedTag: " · Paused"
  assemblyField: The Assembly · {seats} seats
  partyLine: "{party}: {seats} seats · {members} members"
  independentsLine: "Independents: {seats} seats · {factions} factions"
  noParties: No parties yet.
  issuesField: Open issues
  noIssues: None yet.
  footer: Updated after every resolution

alerts:
  resolution:
    missed: The resolution due <t:{time}:F> was missed while the bot was offline. Running it once now.
    failed: |-
      ⚠️ The resolution of {label} failed and was rolled back; nothing was posted. The schedule is paused. Seed {seed}.
      ```
      {error}
      ```
    publishFailed: "⚠️ Resolution {number} committed, but publishing failed half way: {error}"
  party:
    dissolved: Party '{party}' (id {id}) dissolved{last}{outcome}
    lastUnknown: "; its last member could not be identified from the role holders."
    lastKnown: "; its last member {faction} is now independent."
    cleanedUp: " Its role was deleted and its chat archived."
    changesFailed: " {count} Discord change(s) failed; see the alerts above."
  billCooldownOver: "{bill} is back from its cooldown and can be proposed again."
  noEventQueued: No event is queued for the start of the next turn, after {label}.
  upkeepShort: The {ministry} purse could not cover its {due} upkeep; every {type} unit lost a training step.

private:
  topic: "Private office: poll results, reminders and your commands."
  topicNamed: "The private office of {name}: poll results, reminders and your commands."
  channelName: faction-{id}

sync:
  discordRefused: "Discord refused to {what}: {error}"
  faction:
    noCategoryFor: "Could not open a private channel for <@{faction}>: no Factions category is set. Run `/gm setup`."
    noCategory: No Factions category is set, so no private faction channel could be checked.
    postFailed: "Could not post in the private channel of <@{faction}>: {error}"
    noGuild: "Could not open a private channel for <@{faction}>: the bot cannot see the Factions category's server."
    refused: "Discord refused the private channel of <@{faction}>: {error}"
  cabinet:
    noRole: No Cabinet role is set; set it with `/gm channel set` or `/gm setup`.
    roleGone: The Cabinet role <@&{role}> no longer exists; set it again with `/gm channel set` or `/gm setup`.
    give: give {user} the Cabinet role
    take: take the Cabinet role from {user}
  party:
    channelNameFallback: party
    missing: Party {id} does not exist.
    createRole: create the role for party '{party}'
    updateRole: update the role {role} for party '{party}'
    giveRole: give {user} the role of party '{party}'
    takeRole: take the role of party '{party}' from {user}
    categoryGone: The party category <#{category}> no longer exists; set it again with `/gm channel set` or `/gm setup`.
    noCategory: No party category is set, so the chat of party '{party}' could not be created.
    createChat: create the chat for party '{party}'
    updateChat: update the chat <#{channel}> of party '{party}'
    deleteRole: delete the role of party '{party}'
    noArchive: No archive category is set, so the chat <#{channel}> of party '{party}' was locked where it is.
    archiveChat: archive the chat <#{channel}> of party '{party}'
    noNews: "No #news channel is set, so an announcement was not posted."
    newsFailed: "Could not post to #news: {error}"
    noGuild: The bot is not connected to a server.

