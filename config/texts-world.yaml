    allocation: Allocation {year}
    navyContribution: Contribution paid to the Anzarian fleet
    unallocated: Unallocated {year} budget
    upkeep: "Upkeep {year}: {count} {type} unit(s)"

files:
  config:
    reloaded: "Config files changed: `config/` reloaded. Values already in play are unchanged."
    failed: |-
      ⚠️ Config files changed, but they don't load; the old config stays in force.
      {error}
  content:
    summary: "**Content files loaded:** {ok} imported or updated, {ready} marked Ready, {unchanged} unchanged."
    leftAsDraft: "- Left as Draft: {problem}"

bot:
  notWhitelisted: This channel isn't whitelisted for bot commands. Ask a server manager to run `/whitelist add` here.
  failed: ⚠️ {reason}
  userLeft: "{faction} ({user}) left the server while their faction is active. Consider `/gm faction retire`."
